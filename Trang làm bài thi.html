<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trang làm bài thi</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#dfe3ec;--pr:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b5;--bd:#333948;--pr:#7c93f5;--ok:#69db7c;--okb:#17301e;--no:#ff8787;--nob:#3a1b1b}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b5;--bd:#333948;--pr:#7c93f5;--ok:#69db7c;--okb:#17301e;--no:#ff8787;--nob:#3a1b1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bgi,#bgo{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none}
#bgo{background:var(--bg);opacity:0}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
h2{font-size:18px;margin:28px 0 4px;color:var(--pr)}
.sub{color:var(--mu);font-size:14px;margin:0 0 10px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1}
button{font:inherit;padding:9px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.card b.n{color:var(--pr)}
input[type=text],input[type=number],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:80px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row input[type=text]{flex:1}
label.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
label.opt:hover{background:var(--bg)}
.q{white-space:pre-wrap;margin:0 0 6px}
.ds{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px dashed var(--bd);padding:6px 0}
.ds span.t{flex:1}
.ds label{margin-left:8px;white-space:nowrap}
.res{margin-top:8px;font-size:14px;padding:6px 10px;border-radius:6px}
.res.ok{background:var(--okb);color:var(--ok)}.res.no{background:var(--nob);color:var(--no)}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;margin:6px 0;z-index:4}
#timer{font-weight:700;font-variant-numeric:tabular-nums}
.score{text-align:center;font-size:30px;font-weight:800;color:var(--pr)}
.hide{display:none}
.mu{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<div id="bgi"></div><div id="bgo"></div>
<div class="wrap">
<h1 id="ttl">Trang làm bài thi</h1>
<div class="tabs">
  <button id="t-edit" class="on">✏️ Soạn đề</button>
  <button id="t-take">📝 Làm bài</button>
  <button id="t-hist">📊 Lịch sử</button>
  <button id="t-data">💾 Dữ liệu</button>
</div>
<div id="v-edit"></div>
<div id="v-take" class="hide"></div>
<div id="v-hist" class="hide"></div>
<div id="v-lock" class="hide"></div>
<div id="v-data" class="hide">
  <div class="card">
    <b>🖼️ Ảnh nền</b>
    <p class="sub">Chọn ảnh từ máy. Ảnh được thu nhỏ tự động và lưu cùng đề. Kéo thanh để làm nền mờ hơn cho dễ đọc.</p>
    <div class="row"><input type="file" id="bgf" accept="image/*"><button id="bgx">Xóa ảnh nền</button></div>
    <div class="row"><span class="mu">Độ mờ phủ</span><input type="range" id="bgr" min="0" max="95" value="75" style="flex:1"></div>
  </div>
  <div class="card">
    <p class="sub">Dữ liệu tự lưu trong trình duyệt này. Để chuyển sang máy khác hoặc sao lưu: bấm <b>Xuất</b>, copy đoạn văn bản và cất đi; khi cần dán lại rồi bấm <b>Nhập</b>.</p>
    <textarea id="io" style="min-height:220px" placeholder="Dán dữ liệu vào đây để nhập..."></textarea>
    <div class="row"><button class="pri" id="b-exp">Xuất</button><button id="b-imp">Nhập</button><button id="b-clr">Xóa toàn bộ đề</button></div>
    <p class="mu" id="io-msg"></p>
  </div>
</div>
</div>
<script>
const K='examDataV1';
const blank=()=>({title:'Đề thi của tôi',time:90,
 p1:Array.from({length:12},()=>({q:'',o:['','','',''],a:-1})),
 p2:Array.from({length:4},()=>({q:'',s:Array.from({length:4},()=>({t:'',a:null}))})),
 p3:Array.from({length:6},()=>({q:'',a:''}))});
let D;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D||!D.p1||!D.p2||!D.p3)D=blank();
D.p1=D.p1.slice(0,12);while(D.p1.length<12)D.p1.push({q:'',o:['','','',''],a:-1});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const L='ABCD';

function setPath(p,v){const a=p.split('.');let o=D;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;save();if(a[0]==='title')$('ttl').textContent=v||'Trang làm bài thi'}

/* ---------- SOẠN ĐỀ ---------- */
function renderEdit(){
 let h=`<div class="card"><div class="row"><span style="width:90px">Tên đề</span><input type="text" data-p="title" value="${esc(D.title)}"></div>
 <div class="row"><span style="width:90px">Thời gian</span><input type="number" min="0" style="width:100px" data-p="time" data-n="1" value="${D.time}"> <span class="mu">phút (0 = không giới hạn)</span></div></div>
 <h2>Phần I. Trắc nghiệm nhiều lựa chọn (12 câu · 0,5đ/câu)</h2><p class="sub">Nhập nội dung, 4 đáp án và chọn đáp án đúng.</p>`;
 D.p1.forEach((c,i)=>{h+=`<div class="card"><b class="n">Câu ${i+1}</b><textarea data-p="p1.${i}.q" placeholder="Nội dung câu hỏi">${esc(c.q)}</textarea>`;
  c.o.forEach((o,j)=>{h+=`<div class="row"><input type="radio" name="e1_${i}" data-p="p1.${i}.a" data-v="${j}" ${c.a===j?'checked':''} title="Đáp án đúng"><b>${L[j]}.</b><input type="text" data-p="p1.${i}.o.${j}" value="${esc(o)}"></div>`});
  h+=`</div>`});
 h+=`<h2>Phần II. Đúng/Sai (4 câu · mỗi câu 4 ý · tối đa 1đ/câu)</h2><p class="sub">Mỗi câu: đúng 1 ý = 0,1đ · 2 ý = 0,25đ · 3 ý = 0,5đ · 4 ý = 1đ.</p>`;
 D.p2.forEach((c,i)=>{h+=`<div class="card"><b class="n">Câu ${i+1}</b><textarea data-p="p2.${i}.q" placeholder="Nội dung dẫn / đề bài chung">${esc(c.q)}</textarea>`;
  c.s.forEach((s,j)=>{const nm=`e2_${i}_${j}`;h+=`<div class="row"><b>${'abcd'[j]})</b><input type="text" data-p="p2.${i}.s.${j}.t" value="${esc(s.t)}" placeholder="Nội dung ý ${'abcd'[j]}">
   <label><input type="radio" name="${nm}" data-p="p2.${i}.s.${j}.a" data-v="true" ${s.a===true?'checked':''}> Đ</label>
   <label><input type="radio" name="${nm}" data-p="p2.${i}.s.${j}.a" data-v="false" ${s.a===false?'checked':''}> S</label></div>`});
  h+=`</div>`});
 
 [].forEach((c,i)=>{h+=`<div class="card"><b class="n">Câu ${i+1}</b><textarea data-p="p3.${i}.q" placeholder="Nội dung câu hỏi">${esc(c.q)}</textarea>
  <div class="row"><b>Đáp án:</b><input type="text" data-p="p3.${i}.a" value="${esc(c.a)}"></div></div>`});
 $('v-edit').innerHTML=h;
}
$('v-edit').addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p||t.type==='radio')return;setPath(p,t.dataset.n?Number(t.value)||0:t.value)});
$('v-edit').addEventListener('change',e=>{const t=e.target,p=t.dataset.p;if(p&&t.type==='radio')setPath(p,JSON.parse(t.dataset.v))});

/* ---------- LÀM BÀI ---------- */
let timer=null,left=0,done=false,t0=0;
let who='';
function startTest(){
 clearInterval(timer);
 $('v-take').innerHTML=`<div class="card" style="text-align:center"><h2 style="margin-top:4px">${esc(D.title)}</h2><p class="mu">12 câu trắc nghiệm · 4 câu Đúng/Sai · ${D.time>0?D.time+' phút':'không giới hạn thời gian'}</p><div class="row"><input type="text" id="who" placeholder="Nhập họ tên để bắt đầu" value="${esc(who)}"></div><p id="wmsg" style="color:var(--no);margin:6px 0;min-height:22px"></p><button class="pri" id="b-go">Bắt đầu làm bài</button></div>`;
 const go=()=>{const v=$('who').value.trim();if(!v){$('wmsg').textContent='Vui lòng nhập họ tên trước khi làm bài.';$('who').focus();return}who=v;beginTest()};
 $('b-go').onclick=go;$('who').onkeydown=e=>{if(e.key==='Enter')go()};
}
function beginTest(){
 clearInterval(timer);done=false;t0=Date.now();
 let h=`<div class="bar"><span>${esc(D.title)}</span><span id="timer"></span><button class="pri" id="b-sub">Nộp bài</button></div>
 <div class="card mu">Người làm bài: <b>${esc(who)}</b></div>
 <h2>Phần I. Trắc nghiệm (câu 1–12)</h2>`;
 D.p1.forEach((c,i)=>{h+=`<div class="card" id="c1_${i}"><b class="n">Câu ${i+1}.</b><p class="q">${esc(c.q)||'<i class="mu">(chưa soạn)</i>'}</p>`;
  c.o.forEach((o,j)=>{h+=`<label class="opt"><input type="radio" name="t1_${i}" value="${j}"><span><b>${L[j]}.</b> ${esc(o)}</span></label>`});
  h+=`<div class="res hide"></div></div>`});
 h+=`<h2>Phần II. Đúng/Sai</h2>`;
 D.p2.forEach((c,i)=>{h+=`<div class="card" id="c2_${i}"><b class="n">Câu ${i+1}.</b><p class="q">${esc(c.q)||'<i class="mu">(chưa soạn)</i>'}</p>`;
  c.s.forEach((s,j)=>{h+=`<div class="ds"><span class="t"><b>${'abcd'[j]})</b> ${esc(s.t)}</span><span><label><input type="radio" name="t2_${i}_${j}" value="true"> Đúng</label><label><input type="radio" name="t2_${i}_${j}" value="false"> Sai</label></span></div>`});
  h+=`<div class="res hide"></div></div>`});
 
 [].forEach((c,i)=>{h+=`<div class="card" id="c3_${i}"><b class="n">Câu ${i+1}.</b><p class="q">${esc(c.q)||'<i class="mu">(chưa soạn)</i>'}</p><input type="text" name="t3_${i}" placeholder="Nhập đáp án"><div class="res hide"></div></div>`});
 h+=`<div id="result"></div>`;
 $('v-take').innerHTML=h;
 $('b-sub').onclick=()=>{if(confirm('Nộp bài ngay?'))submit()};
 if(D.time>0){left=D.time*60;tick();timer=setInterval(()=>{left--;tick();if(left<=0)submit()},1000)}
 else $('timer').textContent='';
}
function tick(){const m=Math.floor(left/60),s=left%60;$('timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
const norm=s=>String(s||'').trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,' ');
function mark(id,ok,txt){const r=document.querySelector('#'+id+' .res');r.classList.remove('hide','ok','no');r.classList.add(ok?'ok':'no');r.innerHTML=txt}
function submit(){
 if(done)return;done=true;clearInterval(timer);
 let s1=0,s2=0,s3=0,n1=0,n3=0;const w1=[],b1=[],q2=[];let y2=0,x2=0;
 D.p1.forEach((c,i)=>{const r=document.querySelector(`input[name=t1_${i}]:checked`);const ok=r&&Number(r.value)===c.a;if(ok){s1+=.5;n1++}else{(r?w1:b1).push(i+1)}
  mark('c1_'+i,ok,(ok?'✔ Đúng · +0,5đ':'✘ Sai')+(ok?'':' · Đáp án đúng: '+(c.a>=0?L[c.a]:'chưa đặt')))});
 D.p2.forEach((c,i)=>{let k=0,det=[];c.s.forEach((s,j)=>{const r=document.querySelector(`input[name=t2_${i}_${j}]:checked`);const ok=r&&(r.value==='true')===s.a;if(ok){k++;y2++}else x2++;det.push('abcd'[j]+':'+(s.a===true?'Đ':s.a===false?'S':'?'))});
  const pt=[0,.1,.25,.5,1][k];s2+=pt;q2.push(k);mark('c2_'+i,k===4,`Đúng ${k}/4 ý · +${String(pt).replace('.',',')}đ · Đáp án: ${det.join(' · ')}`)});
 [].forEach((c,i)=>{const v=document.querySelector(`input[name=t3_${i}]`).value;const ok=norm(v)!==''&&norm(v)===norm(c.a);if(ok){s3+=.25;n3++}
  mark('c3_'+i,ok,(ok?'✔ Đúng · +0,25đ':'✘ Sai')+(ok?'':' · Đáp án đúng: '+esc(c.a||'chưa đặt')))});
 document.querySelectorAll('#v-take input').forEach(x=>x.disabled=true);
 const tot=s1+s2+s3,f=x=>(Math.round(x*1000)/1000).toString().replace('.',',');
 const sec=Math.round((Date.now()-t0)/1000);
 addHist({name:who,at:Date.now(),sec,score:tot,s1,s2,r1:n1,w1,b1,q2,y2,x2});
 $('result').innerHTML=`<div class="card"><div class="score">${f(tot)} / 10 điểm</div>
 <p style="text-align:center" class="mu">Phần I: ${f(s1)}/6 (${n1}/12 câu) · Phần II: ${f(s2)}/4<br>Thời gian làm: ${fmtT(sec)} · đã lưu vào tab Lịch sử</p>
 <div class="row" style="justify-content:center"><button class="pri" id="b-again">Làm lại</button></div></div>`;
 $('b-again').onclick=startTest;
 $('timer').textContent='Đã nộp';
 $('result').scrollIntoView({behavior:'smooth'});
}

/* ---------- TAB & DỮ LIỆU ---------- */
let unlocked='';
function lockScreen(t){
 ['edit','take','hist','data'].forEach(k=>{$('v-'+k).classList.add('hide');$('t-'+k).classList.toggle('on',k===t)});
 const L2=$('v-lock');L2.classList.remove('hide');
 L2.innerHTML=`<div class="card" style="text-align:center"><h2 style="margin-top:4px">🔒 Nhập mật khẩu</h2><p class="mu">Khu vực này chỉ dành cho người soạn đề.</p><div class="row"><input type="password" id="pw" inputmode="numeric" placeholder="Mật khẩu"></div><p id="pmsg" style="color:var(--no);min-height:22px;margin:6px 0"></p><button class="pri" id="b-pw">Mở khóa</button></div>`;
 const go=()=>{if($('pw').value==='3667'){unlocked=t;show(t)}else{$('pmsg').textContent='Sai mật khẩu, vui lòng thử lại.';$('pw').value='';$('pw').focus()}};
 $('b-pw').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};$('pw').focus();
}
function show(t){
 $('v-lock').classList.add('hide');
 if((t==='edit'||t==='data'||t==='hist')&&unlocked!==t){clearInterval(timer);lockScreen(t);return}
 unlocked=(t==='edit'||t==='data'||t==='hist')?t:'';
 ['edit','take','hist','data'].forEach(k=>{$('v-'+k).classList.toggle('hide',k!==t);$('t-'+k).classList.toggle('on',k===t)});
 if(t==='take')startTest();else{clearInterval(timer)}if(t==='hist')renderHist();
 window.scrollTo(0,0);
}
['edit','take','hist','data'].forEach(k=>$('t-'+k).onclick=()=>show(k));
$('b-exp').onclick=()=>{$('io').value=JSON.stringify(D);$('io').select();$('io-msg').textContent='Đã xuất. Hãy copy toàn bộ đoạn trên để lưu lại.'};
$('b-imp').onclick=()=>{try{const x=JSON.parse($('io').value);if(!x.p1||!x.p2||x.p2.length!==4||!x.p3||x.p3.length!==6)throw 0;x.p1=x.p1.slice(0,12);while(x.p1.length<12)x.p1.push({q:'',o:['','','',''],a:-1});D=x;save();renderEdit();applyBg();$('ttl').textContent=D.title;$('io-msg').textContent='Nhập thành công.'}catch(e){$('io-msg').textContent='Dữ liệu không hợp lệ.'}};
$('b-clr').onclick=()=>{if(confirm('Xóa toàn bộ đề đã soạn?')){D=blank();save();renderEdit();applyBg();$('ttl').textContent=D.title;$('io-msg').textContent='Đã xóa.'}};
$('ttl').textContent=D.title;
function applyBg(){
 $('bgi').style.backgroundImage=D.bg?`url("${D.bg}")`:'none';
 const o=D.bgo==null?.75:D.bgo;
 $('bgo').style.opacity=D.bg?o:0;$('bgr').value=Math.round(o*100);
}
$('bgf').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const fr=new FileReader();
 fr.onload=()=>{const img=new Image();
  img.onload=()=>{const r=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   D.bg=c.toDataURL('image/jpeg',.75);if(D.bgo==null)D.bgo=.75;save();applyBg()};
  img.src=fr.result};
 fr.readAsDataURL(f);
};
$('bgx').onclick=()=>{delete D.bg;save();applyBg();$('bgf').value=''};
$('bgr').oninput=e=>{D.bgo=Number(e.target.value)/100;save();applyBg()};
const HK='examHistV1';
function getH(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return []}}
function setH(a){try{localStorage.setItem(HK,JSON.stringify(a))}catch(e){}}
function addHist(r){const a=getH();a.unshift(r);setH(a)}
const fmtT=s=>Math.floor(s/60)+' phút '+String(s%60).padStart(2,'0')+' giây';
const fn=x=>(Math.round(x*1000)/1000).toString().replace('.',',');
function renderHist(){
 const a=getH();let h='<h2>Lịch sử làm bài</h2>';
 if(!a.length){$('v-hist').innerHTML=h+'<div class="card mu">Chưa có lượt làm bài nào. Làm bài và nộp ở tab "Làm bài" thì kết quả sẽ hiện ở đây.</div>';return}
 const avg=a.reduce((s,r)=>s+r.score,0)/a.length;
 h+=`<div class="card">Tổng: <b>${a.length}</b> lượt · Điểm trung bình: <b>${fn(avg)}</b> · Cao nhất: <b>${fn(Math.max(...a.map(r=>r.score)))}</b> <button id="h-clr" style="float:right">Xóa tất cả</button></div>`;
 a.forEach((r,i)=>{
  const sai=r.w1.length,bo=r.b1.length;
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(r.name)}</b><span class="mu">${new Date(r.at).toLocaleString('vi-VN')}</span></div>
  <div class="score" style="font-size:24px;text-align:left">${fn(r.score)} / 10 điểm <span class="mu" style="font-size:14px;font-weight:400">· ${fmtT(r.sec)}</span></div>
  <p style="margin:6px 0"><b>Phần I</b> (${fn(r.s1)}/6): đúng <b style="color:var(--ok)">${r.r1}</b> · sai <b style="color:var(--no)">${sai}</b> · bỏ trống <b>${bo}</b> / 12 câu${sai?`<br><span class="mu">Câu sai: ${r.w1.join(', ')}</span>`:''}${bo?`<br><span class="mu">Câu bỏ trống: ${r.b1.join(', ')}</span>`:''}</p>
  <p style="margin:6px 0"><b>Phần II</b> (${fn(r.s2)}/4): ý đúng <b style="color:var(--ok)">${r.y2}</b> · ý sai/bỏ trống <b style="color:var(--no)">${r.x2}</b> / 16 ý<br><span class="mu">${r.q2.map((k,j)=>'Câu '+(j+1)+': '+k+'/4').join(' · ')}</span></p>
  <button data-del="${i}">Xóa lượt này</button></div>`});
 $('v-hist').innerHTML=h;
}
$('v-hist').addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.del!==undefined){const a=getH();a.splice(Number(t.dataset.del),1);setH(a);renderHist()}
 else if(t.id==='h-clr'&&confirm('Xóa toàn bộ lịch sử làm bài?')){setH([]);renderHist()}
});
applyBg();
renderEdit();
show('take');
</script>
